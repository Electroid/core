name: Docs
on:
    workflow_dispatch:
    workflow_call:

jobs:
    deploy:
        runs-on: ubuntu-latest
        name: Deploy
        permissions:
            contents: write
            id-token: write
            pages: write
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Build
              run: bun run build:docs

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./docs

            - name: Deploy
              id: deploy
              uses: actions/deploy-pages@v4
